<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8fd8e8">

  <title>Bamburi Beach Hotel - Daily Events</title>

  <!-- Bamburi Beach Hotel Browser Icon -->
  <link rel="icon" type="image/png" href="bamburi_logo_resized_400h.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.78)
        ),
        linear-gradient(
          135deg,
          #dff7fb,
          #eefcff
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 8px 10px;

      color: #174b50;
    }

    .page {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    /* HOTEL LOGO */
    .hotel-logo {
      width: min(125px, 31vw);
      height: auto;
      display: block;
      margin: 0 auto 6px;
      object-fit: contain;
    }

    /* HOTEL NAME */
    .hotel-name {
      font-family: Algerian, "Algerian", Georgia, serif;
      font-size: clamp(23px, 5.8vw, 40px);
      letter-spacing: 0.5px;
      margin: 0;
      line-height: 1.08;
      color: #0077b6;
    }

    /* SUBTITLE */
    .subtitle {
      margin: 4px 0 13px;
      font-size: 10px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #52777d;
    }

    /* DAILY EVENTS TITLE */
    .events-title {
      display: inline-block;
      margin: 0 0 14px;
      font-family: Georgia, serif;
      font-size: clamp(27px, 6.2vw, 40px);
      font-weight: 700;
      line-height: 1;
      color: #174b50;
      animation: titleFloat 2.8s ease-in-out infinite;
      position: relative;
    }

    .events-title::after {
      content: "";
      display: block;
      height: 2px;
      width: 65%;
      margin: 4px auto 0;
      border-radius: 10px;
      background: #74c9dc;
      animation: linePulse 2.8s ease-in-out infinite;
    }

    /* BUTTON AREA */
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 0 12px;
    }

    /* EVENT BUTTONS */
    .event-button {
      width: min(88%, 450px);
      min-height: 58px;

      /*
       * Gradient border:
       * The first gradient is the button background.
       * The second gradient creates the blue border.
       */
      border: 3px solid transparent;
      border-radius: 17px;

      background:
        linear-gradient(#eafaff, #cceff7) padding-box,
        linear-gradient(
          135deg,
          #006b9e,
          #45c7e8,
          #0077b6
        ) border-box;

      color: #064b5b;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 18px;

      font-size: clamp(15px, 3.8vw, 19px);
      font-weight: 700;
      letter-spacing: 0.2px;

      box-shadow:
        0 7px 15px rgba(0, 80, 100, 0.15);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      cursor: pointer;
    }

    /* ADULTS BUTTON */
    .adults {
      background:
        linear-gradient(#d9f5fb, #bdebf4) padding-box,
        linear-gradient(
          135deg,
          #006b9e,
          #32c5e8,
          #0077b6
        ) border-box;
    }

    /* KIDS BUTTON */
    .kids {
      background:
        linear-gradient(#e4f8fc, #c7eef6) padding-box,
        linear-gradient(
          135deg,
          #0077b6,
          #5dd5ed,
          #006b9e
        ) border-box;
    }

    /* EVENING BUTTON */
    .evening {
      background:
        linear-gradient(#eafaff, #d0f2f8) padding-box,
        linear-gradient(
          135deg,
          #006b9e,
          #42c9e8,
          #0077b6
        ) border-box;
    }

    /* BUTTON HOVER */
    .event-button:hover,
    .event-button:focus {
      transform: translateY(-3px) scale(1.01);

      box-shadow:
        0 11px 22px rgba(0, 90, 120, 0.23);

      outline: none;
    }

    /* BUTTON PRESS */
    .event-button:active {
      transform: scale(0.98);
    }

    /* ICON */
    .icon {
      font-size: 20px;
      margin-right: 9px;
    }

    /* HINT */
    .hint {
      font-size: 10px;
      color: #667879;
      margin-top: 1px;
    }

    /* COPYRIGHT */
    .copyright {
      margin-top: 4px;
      font-size: 9px;
      color: #777;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    /* ANIMATIONS */
    @keyframes titleFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes linePulse {
      0%,
      100% {
        width: 50%;
        opacity: 0.65;
      }

      50% {
        width: 75%;
        opacity: 1;
      }
    }

    /* SMALL PHONES */
    @media (max-height: 700px) {

      body {
        padding: 7px 8px;
      }

      .hotel-logo {
        width: 105px;
        margin-bottom: 4px;
      }

      .hotel-name {
        font-size: 24px;
      }

      .subtitle {
        margin: 3px 0 9px;
        font-size: 9px;
      }

      .events-title {
        font-size: 27px;
        margin-bottom: 11px;
      }

      .buttons {
        gap: 8px;
        padding-bottom: 9px;
      }

      .event-button {
        min-height: 54px;
        border-radius: 15px;
        font-size: 15px;
      }

      .icon {
        font-size: 20px;
        margin-right: 9px;
      }

      .footer {
        margin-top: 6px;
      }
    }

    /* VERY SMALL PHONES */
    @media (max-height: 600px) {

      body {
        padding: 5px 7px;
      }

      .hotel-logo {
        width: 85px;
        margin-bottom: 3px;
      }

      .hotel-name {
        font-size: 21px;
      }

      .subtitle {
        margin: 2px 0 6px;
        font-size: 8px;
      }

      .events-title {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .buttons {
        gap: 6px;
        padding-bottom: 7px;
      }

      .event-button {
        min-height: 48px;
        border-radius: 14px;
        font-size: 14px;
        border-width: 2px;
      }

      .icon {
        font-size: 18px;
        margin-right: 7px;
      }

      .hint {
        font-size: 9px;
      }

      .footer {
        margin-top: 5px;
        font-size: 9px;
      }

      .copyright {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- HOTEL LOGO -->
    <img
      src="bamburi_logo_resized_400h.png"
      alt="Bamburi Beach Hotel Logo"
      class="hotel-logo"
    >

    <!-- HOTEL NAME -->
    <h1 class="hotel-name">
      Bamburi Beach Hotel
    </h1>

    <!-- TAGLINE -->
    <div class="subtitle">
      Waves &nbsp;|&nbsp; Sand &nbsp;|&nbsp; Serenity
    </div>

    <!-- DAILY EVENTS -->
    <h2 class="events-title">
      Daily Events
    </h2>

    <!-- EVENT BUTTONS -->
    <section class="buttons" aria-label="Daily Events">

     <!-- ADULTS -->
<a
  class="event-button adults"
  href="pdf-viewer.html?type=adults&title=Adults%20Daily%20Events"
  target="_self"
  aria-label="Open Adults Daily Events"
>
  <span class="icon">☀</span>
  <span>Adults Daily Events</span>
</a>

<!-- KIDS -->
<a
  class="event-button kids"
  href="pdf-viewer.html?type=kids&title=Kids%20Daily%20Events"
  target="_self"
  aria-label="Open Kids Daily Events"
>
  <span class="icon">★</span>
  <span>Kids Daily Events</span>
</a>

<!-- EVENING -->
<a
  class="event-button evening"
  href="pdf-viewer.html?type=evening&title=Evening%20Daily%20Events"
  target="_self"
  aria-label="Open Evening Daily Events"
>
  <span class="icon">☾</span>
  <span>Evening Daily Events</span>
</a>

    </section>

    <!-- INSTRUCTION -->
    <div class="hint">
      Tap an event above to view the programme
    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">
      Copyright © Bamburi Beach Hotel. All Rights Reserved.
    </div>

  </main>

</body>
</html>
