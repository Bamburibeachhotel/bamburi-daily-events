<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Bamburi Beach Hotel - Daily Events</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .viewer {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    .topbar {
      flex: 0 0 auto;
      min-height: 58px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      z-index: 10;
    }

    .back {
      border: 0;
      border-radius: 9px;
      background: #006b75;
      color: #fff;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .back:hover {
      background: #00545c;
    }

    .brand {
      min-width: 0;
      flex: 1;
    }

    .brand-name {
      margin: 0;
      color: #000;
      font-family: Algerian, "Algerian", Georgia, serif;
      font-size: clamp(15px, 4vw, 23px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .document-title {
      margin: 2px 0 0;
      color: #777;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-area {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #333;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      background: #222;
      z-index: 1;
      pointer-events: none;
      font-size: 14px;
    }

    .error {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #fff;
      background: #222;
      z-index: 3;
    }

    .error strong {
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
    }

    @media (max-width: 500px) {
      .topbar {
        min-height: 54px;
        padding: 7px 9px;
        gap: 8px;
      }

      .back {
        padding: 9px 11px;
        font-size: 13px;
      }

      .document-title {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <header class="topbar">
      <button class="back" onclick="goBack()">← Back</button>
      <div class="brand">
        <h1 class="brand-name">Bamburi Beach Hotel</h1>
        <p class="document-title" id="documentTitle">Daily Events</p>
      </div>
    </header>

    <main class="pdf-area">
      <div class="loading" id="loading">Loading programme...</div>

      <iframe
        id="pdfFrame"
        class="pdf-frame"
        title="Bamburi Beach Hotel Daily Events PDF"
        loading="eager">
      </iframe>

      <div class="error" id="error">
        <div>
          <strong>Programme unavailable</strong>
          <div>The requested event programme could not be opened.</div>
          <br>
          <button class="back" onclick="goBack()">← Back to Daily Events</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const title = params.get("title") || "Daily Events";

    document.getElementById("documentTitle").textContent =
      decodeURIComponent(title.replace(/\+/g, " "));

    function goBack() {
      if (document.referrer && history.length > 1) {
        history.back();
      } else {
        window.location.href = "index.html";
      }
    }

    if (!file || !/^[a-zA-Z0-9._-]+\.pdf$/i.test(file)) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "flex";
    } else {
      const frame = document.getElementById("pdfFrame");

      // These PDF parameters ask supporting PDF viewers not to show navigation panes
      // and to hide the toolbar where supported. Browser support varies.
      frame.src = encodeURI(file) + "#toolbar=0&navpanes=0&view=FitH";

      frame.addEventListener("load", () => {
        document.getElementById("loading").style.display = "none";
      });

      // Prevent a permanently visible loading screen on viewers that don't fire load.
      setTimeout(() => {
        document.getElementById("loading").style.display = "none";
      }, 2500);
    }
  </script>
</body>
</html>
